<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Raw log lines clustered into failure signatures with a ranked probable root cause">
  <rect width="800" height="450" fill="#F1F2F4"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4C525A">
    <text x="48" y="46">LOG STREAM → SIGNATURE CLUSTERS → CAUSE</text>
  </g>
  <line x1="48" y1="62" x2="752" y2="62" stroke="#D8DBE0"/>

  <!-- Raw log column -->
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="48" y="94">RAW LINES</text>
  </g>
  <g stroke="#D8DBE0" stroke-width="1">
    <line x1="48" y1="114" x2="242" y2="114"/>
    <line x1="48" y1="130" x2="212" y2="130"/>
    <line x1="48" y1="146" x2="238" y2="146"/>
    <line x1="48" y1="162" x2="188" y2="162"/>
    <line x1="48" y1="178" x2="230" y2="178"/>
    <line x1="48" y1="194" x2="204" y2="194"/>
    <line x1="48" y1="210" x2="242" y2="210"/>
    <line x1="48" y1="226" x2="176" y2="226"/>
    <line x1="48" y1="242" x2="220" y2="242"/>
    <line x1="48" y1="258" x2="196" y2="258"/>
    <line x1="48" y1="274" x2="234" y2="274"/>
    <line x1="48" y1="290" x2="184" y2="290"/>
  </g>
  <!-- error lines highlighted -->
  <g stroke="#175E68" stroke-width="1.5">
    <line x1="48" y1="146" x2="238" y2="146"/>
    <line x1="48" y1="210" x2="242" y2="210"/>
    <line x1="48" y1="274" x2="234" y2="274"/>
  </g>

  <!-- Clustering arrows -->
  <g stroke="#1A1C20" stroke-width="1" fill="none">
    <path d="M258 146 C296 146 300 156 330 156"/>
    <path d="M258 210 C296 210 300 200 330 200"/>
    <path d="M258 274 C296 274 300 250 330 244"/>
    <path d="M324 151 l6 5 -6 5"/>
  </g>

  <!-- Signature clusters -->
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="346" y="94">SIGNATURES</text>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="10">
    <rect x="346" y="132" width="196" height="42" fill="none" stroke="#175E68" stroke-width="1.5"/>
    <text x="362" y="158" fill="#1A1C20">TIMEOUT · pool exhausted</text>
    <text x="518" y="158" fill="#175E68">42</text>

    <rect x="346" y="186" width="196" height="42" fill="none" stroke="#1A1C20"/>
    <text x="362" y="212" fill="#1A1C20">RETRY · upstream 503</text>
    <text x="518" y="212" fill="#4C525A">17</text>

    <rect x="346" y="240" width="196" height="42" fill="none" stroke="#1A1C20"/>
    <text x="362" y="266" fill="#1A1C20">SCHEMA · null in key</text>
    <text x="518" y="266" fill="#4C525A">6</text>
  </g>

  <!-- Ranked cause -->
  <g stroke="#1A1C20" stroke-width="1" fill="none">
    <path d="M556 153 H588"/><path d="M582 148 l6 5 -6 5"/>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="600" y="94">PROBABLE CAUSE</text>
  </g>
  <rect x="600" y="112" width="152" height="170" fill="none" stroke="#1A1C20"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="34" fill="#175E68">
    <text x="618" y="164">78%</text>
  </g>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="618" y="184">CONFIDENCE</text>
  </g>
  <line x1="618" y1="198" x2="734" y2="198" stroke="#D8DBE0"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#1A1C20">
    <text x="618" y="220">connection</text>
    <text x="618" y="238">pool sized</text>
    <text x="618" y="256">for old</text>
    <text x="618" y="274">concurrency</text>
  </g>

  <!-- Resolution footer -->
  <line x1="48" y1="330" x2="752" y2="330" stroke="#D8DBE0"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="48" y="356">MEAN TIME TO RESOLUTION</text>
  </g>
  <!-- before / after bars -->
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="48" y="386">BEFORE</text>
    <text x="48" y="414">AFTER</text>
  </g>
  <rect x="130" y="374" width="500" height="14" fill="#D8DBE0"/>
  <rect x="130" y="402" width="200" height="14" fill="#175E68"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#1A1C20">
    <text x="644" y="386">100%</text>
    <text x="344" y="414">40%</text>
  </g>
</svg>
