<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Medallion lakehouse architecture: bronze, silver and gold layers feeding reporting">
  <rect width="800" height="450" fill="#EFEDE8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#6B655B">
    <text x="48" y="46">ONELAKE — MEDALLION LAYERS</text>
  </g>
  <line x1="48" y1="62" x2="752" y2="62" stroke="#C4BEB2" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">
    <!-- Bronze -->
    <rect x="48" y="96" width="176" height="86" fill="none" stroke="#141416" stroke-width="1"/>
    <text x="62" y="122" fill="#6B655B">BRONZE</text>
    <text x="62" y="142" fill="#141416" font-size="12" letter-spacing="0">Raw ingest</text>
    <line x1="62" y1="156" x2="150" y2="156" stroke="#C4BEB2"/>
    <line x1="62" y1="164" x2="128" y2="164" stroke="#C4BEB2"/>

    <!-- Silver -->
    <rect x="264" y="96" width="176" height="86" fill="none" stroke="#141416" stroke-width="1"/>
    <text x="278" y="122" fill="#6B655B">SILVER</text>
    <text x="278" y="142" fill="#141416" font-size="12" letter-spacing="0">Conformed</text>
    <line x1="278" y1="156" x2="366" y2="156" stroke="#C4BEB2"/>
    <line x1="278" y1="164" x2="344" y2="164" stroke="#C4BEB2"/>

    <!-- Gold -->
    <rect x="480" y="96" width="176" height="86" fill="none" stroke="#B4552B" stroke-width="1.5"/>
    <text x="494" y="122" fill="#B4552B">GOLD</text>
    <text x="494" y="142" fill="#141416" font-size="12" letter-spacing="0">Semantic model</text>
    <line x1="494" y1="156" x2="582" y2="156" stroke="#D89972"/>
    <line x1="494" y1="164" x2="560" y2="164" stroke="#D89972"/>
  </g>

  <!-- Flow arrows -->
  <g stroke="#141416" stroke-width="1" fill="none">
    <path d="M224 139 H256"/><path d="M250 134 l6 5 -6 5"/>
    <path d="M440 139 H472"/><path d="M466 134 l6 5 -6 5"/>
  </g>

  <!-- Merge / CDC detail -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2" fill="#6B655B">
    <text x="264" y="206">MERGE ON KEY · CDC</text>
  </g>
  <line x1="264" y1="214" x2="440" y2="214" stroke="#C4BEB2" stroke-dasharray="3 3"/>

  <!-- Reporting plate -->
  <line x1="48" y1="262" x2="752" y2="262" stroke="#C4BEB2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#6B655B">
    <text x="48" y="288">DIRECT LAKE REPORTING</text>
  </g>

  <!-- Bar figure -->
  <g fill="none" stroke="#141416" stroke-width="1">
    <rect x="48" y="308" width="304" height="106"/>
  </g>
  <g fill="#141416">
    <rect x="70" y="378" width="18" height="24"/>
    <rect x="100" y="358" width="18" height="44"/>
    <rect x="130" y="342" width="18" height="60"/>
    <rect x="160" y="366" width="18" height="36"/>
  </g>
  <rect x="190" y="330" width="18" height="72" fill="#B4552B"/>
  <g fill="#141416">
    <rect x="220" y="352" width="18" height="50"/>
    <rect x="250" y="370" width="18" height="32"/>
    <rect x="280" y="346" width="18" height="56"/>
  </g>
  <line x1="70" y1="402" x2="330" y2="402" stroke="#C4BEB2"/>

  <!-- KPI stack -->
  <g fill="none" stroke="#141416" stroke-width="1">
    <rect x="392" y="308" width="360" height="106"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.3" fill="#6B655B">
    <text x="414" y="334">REFRESH</text>
    <text x="530" y="334">LATENCY</text>
    <text x="646" y="334">SLA</text>
  </g>
  <g font-family="Georgia, serif" font-size="26" fill="#141416">
    <text x="414" y="368">4×</text>
    <text x="530" y="368">2m</text>
    <text x="646" y="368" fill="#B4552B">99.5</text>
  </g>
  <line x1="414" y1="386" x2="730" y2="386" stroke="#C4BEB2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2" fill="#6B655B">
    <text x="414" y="403">DAILY</text>
    <text x="530" y="403">P95</text>
    <text x="646" y="403">PERCENT</text>
  </g>
</svg>
