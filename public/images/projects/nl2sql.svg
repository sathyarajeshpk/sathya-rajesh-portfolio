<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Natural language question resolved through a semantic layer into validated SQL and a chart">
  <rect width="800" height="450" fill="#F1F2F4"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4C525A">
    <text x="48" y="46">QUESTION → SEMANTIC LAYER → SQL</text>
  </g>
  <line x1="48" y1="62" x2="752" y2="62" stroke="#D8DBE0"/>

  <!-- The question -->
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#1A1C20">
    <text x="48" y="112">&#8220;Which regions missed target last quarter?&#8221;</text>
  </g>
  <line x1="48" y1="132" x2="470" y2="132" stroke="#175E68" stroke-width="1.5"/>

  <!-- Resolution steps -->
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="10">
    <text x="48" y="176" fill="#4C525A">01</text>
    <text x="82" y="176" fill="#1A1C20">RESOLVE ENTITIES</text>
    <text x="300" y="176" fill="#4C525A">region · target · fiscal quarter</text>

    <text x="48" y="204" fill="#4C525A">02</text>
    <text x="82" y="204" fill="#1A1C20">BIND TO MODEL</text>
    <text x="300" y="204" fill="#4C525A">gold.fct_sales · gold.dim_region</text>

    <text x="48" y="232" fill="#4C525A">03</text>
    <text x="82" y="232" fill="#1A1C20">APPLY GUARDRAILS</text>
    <text x="300" y="232" fill="#4C525A">row limit · RLS · confidence</text>
  </g>
  <line x1="48" y1="150" x2="752" y2="150" stroke="#D8DBE0" stroke-dasharray="3 3"/>
  <line x1="48" y1="248" x2="752" y2="248" stroke="#D8DBE0" stroke-dasharray="3 3"/>

  <!-- Generated SQL -->
  <rect x="48" y="278" width="392" height="136" fill="none" stroke="#1A1C20"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="66" y="302">GENERATED SQL — SHOWN TO THE USER</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1A1C20">
    <text x="66" y="328"><tspan fill="#175E68">SELECT</tspan> r.name, SUM(s.amount)</text>
    <text x="66" y="348"><tspan fill="#175E68">FROM</tspan> gold.fct_sales s</text>
    <text x="66" y="368"><tspan fill="#175E68">JOIN</tspan> gold.dim_region r <tspan fill="#175E68">USING</tspan>(region_id)</text>
    <text x="66" y="388"><tspan fill="#175E68">WHERE</tspan> s.fiscal_q = <tspan fill="#4C525A">'2024Q4'</tspan></text>
  </g>

  <!-- Result chart -->
  <rect x="472" y="278" width="280" height="136" fill="none" stroke="#1A1C20"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="9" fill="#4C525A">
    <text x="490" y="302">RESULT</text>
  </g>
  <!-- target line -->
  <line x1="490" y1="340" x2="734" y2="340" stroke="#175E68" stroke-dasharray="4 3"/>
  <g fill="#1A1C20">
    <rect x="500" y="326" width="26" height="66"/>
    <rect x="540" y="348" width="26" height="44"/>
    <rect x="580" y="318" width="26" height="74"/>
    <rect x="620" y="356" width="26" height="36"/>
    <rect x="660" y="332" width="26" height="60"/>
    <rect x="700" y="362" width="26" height="30"/>
  </g>
  <line x1="490" y1="392" x2="734" y2="392" stroke="#D8DBE0"/>
  <g font-family="'Comic Sans MS', 'Segoe UI', system-ui, sans-serif" font-size="8" fill="#175E68">
    <text x="490" y="334">TARGET</text>
  </g>
</svg>
