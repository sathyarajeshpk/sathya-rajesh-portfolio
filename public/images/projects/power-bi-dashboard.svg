<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Star schema: a central fact table joined to four dimension tables">
  <rect width="800" height="450" fill="#EFEDE8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#6B655B">
    <text x="48" y="46">STAR SCHEMA — EXECUTIVE MODEL</text>
  </g>
  <line x1="48" y1="62" x2="752" y2="62" stroke="#C4BEB2"/>

  <!-- Relationship lines drawn first so boxes sit on top -->
  <g stroke="#C4BEB2" stroke-width="1">
    <path d="M232 148 L352 210" fill="none"/>
    <path d="M568 148 L448 210" fill="none"/>
    <path d="M232 352 L352 268" fill="none"/>
    <path d="M568 352 L448 268" fill="none"/>
  </g>

  <!-- Dimension: Date -->
  <rect x="130" y="106" width="164" height="60" fill="#EFEDE8" stroke="#141416"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">
    <text x="146" y="128" fill="#6B655B">DIM</text>
    <text x="146" y="150" fill="#141416" font-size="12" letter-spacing="0">dim_date</text>
  </g>

  <!-- Dimension: Region -->
  <rect x="506" y="106" width="164" height="60" fill="#EFEDE8" stroke="#141416"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">
    <text x="522" y="128" fill="#6B655B">DIM</text>
    <text x="522" y="150" fill="#141416" font-size="12" letter-spacing="0">dim_region</text>
  </g>

  <!-- Dimension: Product -->
  <rect x="130" y="334" width="164" height="60" fill="#EFEDE8" stroke="#141416"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">
    <text x="146" y="356" fill="#6B655B">DIM</text>
    <text x="146" y="378" fill="#141416" font-size="12" letter-spacing="0">dim_product</text>
  </g>

  <!-- Dimension: Customer -->
  <rect x="506" y="334" width="164" height="60" fill="#EFEDE8" stroke="#141416"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">
    <text x="522" y="356" fill="#6B655B">DIM</text>
    <text x="522" y="378" fill="#141416" font-size="12" letter-spacing="0">dim_customer</text>
  </g>

  <!-- Fact table -->
  <rect x="316" y="196" width="168" height="86" fill="#EFEDE8" stroke="#B4552B" stroke-width="1.5"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.3">
    <text x="334" y="220" fill="#B4552B">FACT</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#141416">
    <text x="334" y="242">fct_sales</text>
  </g>
  <line x1="334" y1="252" x2="466" y2="252" stroke="#D89972"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2" fill="#6B655B">
    <text x="334" y="270">28 DAX MEASURES</text>
  </g>

  <!-- Cardinality marks -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6B655B">
    <text x="262" y="176">1</text><text x="330" y="196">∗</text>
    <text x="530" y="176">1</text><text x="466" y="196">∗</text>
    <text x="262" y="330">1</text><text x="330" y="290">∗</text>
    <text x="530" y="330">1</text><text x="466" y="290">∗</text>
  </g>
</svg>
